<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal | DSAM'S Academy of Music</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <a class="auth-logo brand-logo" href="./index.html" aria-label="DSAM'S Academy of Music home"><img src="./assets/dsam-academy-logo-4k.png" alt="DSAM'S Academy of Music"></a>
    <section class="auth-card" id="authCard">
      <a class="auth-back" href="./index.html">← Back to academy</a>
      <p class="auth-kicker">STUDENT PORTAL</p>
      <h1>Welcome to DSAM'S</h1>
      <p class="auth-copy">Sign in to manage your enrolment, lesson information, and payments.</p>
      <button id="googleButton" class="google-button" type="button"><span>G</span> Continue with Google</button>
      <div class="auth-divider"><span>or use your email</span></div>
      <form id="authForm">
        <label>Email Address<input id="email" type="email" autocomplete="email" required></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" minlength="8" required></label>
        <button id="emailButton" class="btn-primary auth-submit" type="submit">Sign In</button>
      </form>
      <button id="modeButton" class="auth-switch" type="button">New to DSAM'S? Create an account</button>
      <p id="authStatus" class="auth-status" role="status" aria-live="polite"></p>
    </section>
    <section class="auth-card signed-in-card" id="signedInCard" hidden>
      <a class="auth-back" href="./index.html">← Back to academy</a>
      <p class="auth-kicker">STUDENT PORTAL</p>
      <h1>You’re signed in.</h1>
      <p id="memberEmail" class="auth-copy"></p>
      <p class="auth-copy">Your student dashboard will appear here as the enrolment system is completed.</p>
      <button id="signOutButton" class="btn-secondary auth-submit" type="button">Sign Out</button>
    </section>
  </main>
  <script type="module" src="./js/auth.js"></script>
</body>
</html>
