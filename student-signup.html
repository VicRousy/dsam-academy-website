<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign Up | DSAM'S Academy of Music</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="./src/styles/styles.css"></head>
<body class="auth-page" data-auth-mode="signup"><main class="auth-shell"><a class="auth-logo brand-logo" href="./index.html" aria-label="DSAM'S Academy of Music home"><img src="/assets/dsam-academy-logo-4k.png" alt="DSAM'S Academy of Music"></a><section class="auth-card"><a class="auth-back" href="./auth.html">← Student Portal options</a><p class="auth-kicker">NEW STUDENT</p><h1>Create your account</h1><p class="auth-copy">Create an account to submit and track your enrolment.</p><button id="googleButton" class="google-button" type="button"><span>G</span> Continue with Google</button><div class="auth-divider"><span>or sign up with email</span></div><form id="authForm"><label>Email Address<input id="email" type="email" autocomplete="email" required></label><label>Password<span class="password-input-wrap"><input id="password" type="password" autocomplete="new-password" minlength="8" required><button id="passwordToggle" class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">Show</button></span></label><label>Confirm Password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label><button id="emailButton" class="btn-primary auth-submit" type="submit">Sign Up</button></form><p class="auth-switch-copy">Already have an account? <a href="./student-login.html">Log in</a></p><p id="authStatus" class="auth-status" role="status" aria-live="polite"></p></section></main><script type="module" src="./src/scripts/portals/student-auth.js"></script></body></html>
