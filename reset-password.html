<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | DSAM'S Academy of Music</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/styles/styles.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <a class="auth-logo brand-logo" href="./index.html" aria-label="DSAM'S Academy of Music home"><img src="/assets/dsam-academy-logo-4k.png" alt="DSAM'S Academy of Music"></a>
    <section class="auth-card">
      <a class="auth-back" href="./auth.html">← Back to Student Portal</a>
      <p class="auth-kicker">STUDENT PORTAL</p>
      <h1>Set a new password</h1>
      <p class="auth-copy">Choose a new password for signing in with your email address.</p>
      <form id="resetPasswordForm">
        <label>
          New Password
          <span class="password-input-wrap">
            <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required>
            <button id="newPasswordToggle" class="password-toggle" type="button" aria-label="Show new password" aria-pressed="false">Show</button>
          </span>
        </label>
        <label>Confirm New Password<input id="confirmNewPassword" type="password" autocomplete="new-password" minlength="8" required></label>
        <button id="resetPasswordButton" class="btn-primary auth-submit" type="submit">Save New Password</button>
      </form>
      <p id="resetStatus" class="auth-status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script type="module" src="./src/scripts/portals/reset-password.js"></script>
</body>
</html>
